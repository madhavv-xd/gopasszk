basePath: /
definitions:
  handlers.ChangePasswordRequest:
    properties:
      new_auth_hash:
        type: string
      new_salt:
        type: string
      new_wrapped_vault_key:
        type: string
      old_auth_hash:
        type: string
    required:
    - new_auth_hash
    - new_salt
    - new_wrapped_vault_key
    - old_auth_hash
    type: object
  handlers.CredentialRequest:
    properties:
      password_ciphertext:
        type: string
      site_name:
        maxLength: 255
        type: string
      username_ciphertext:
        type: string
    required:
    - password_ciphertext
    - site_name
    - username_ciphertext
    type: object
  handlers.CredentialResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      password_ciphertext:
        type: string
      site_name:
        type: string
      updated_at:
        type: string
      username_ciphertext:
        type: string
    type: object
  handlers.LoginRequest:
    properties:
      auth_hash:
        type: string
      email:
        type: string
    required:
    - auth_hash
    - email
    type: object
  handlers.RecoverKeyRequest:
    properties:
      email:
        type: string
      recovery_auth_hash:
        type: string
    required:
    - email
    - recovery_auth_hash
    type: object
  handlers.RecoverResetRequest:
    properties:
      email:
        type: string
      new_auth_hash:
        type: string
      new_salt:
        type: string
      new_wrapped_vault_key:
        type: string
      recovery_auth_hash:
        type: string
    required:
    - email
    - new_auth_hash
    - new_salt
    - new_wrapped_vault_key
    - recovery_auth_hash
    type: object
  handlers.RegisterRequest:
    properties:
      auth_hash:
        type: string
      email:
        type: string
      recovery_auth_hash:
        type: string
      recovery_wrapped_key:
        type: string
      salt:
        type: string
      wrapped_vault_key:
        type: string
    required:
    - auth_hash
    - email
    - recovery_auth_hash
    - recovery_wrapped_key
    - salt
    - wrapped_vault_key
    type: object
host: localhost:8080
info:
  contact: {}
  description: Zero-knowledge password manager backend. The server only stores auth
    hashes and ciphertext.
  title: Gopass API
  version: "1.0"
paths:
  /credentials:
    get:
      description: Returns the authenticated user's credentials, still encrypted.
        If q is given, only those whose site name contains q (case-insensitive).
      parameters:
      - description: Search term for site name
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/handlers.CredentialResponse'
              type: array
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List or search credentials
      tags:
      - credentials
    post:
      consumes:
      - application/json
      description: Stores an encrypted credential. The owner comes from the JWT, never
        the body.
      parameters:
      - description: Encrypted credential
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.CredentialRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.CredentialResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a credential
      tags:
      - credentials
  /credentials/{id}:
    delete:
      description: Deletes a credential. Returns 404 if it doesn't exist or isn't
        yours.
      parameters:
      - description: Credential ID (UUID)
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete a credential
      tags:
      - credentials
    put:
      consumes:
      - application/json
      description: Replaces a credential's site name and ciphertexts. Returns 404
        if it doesn't exist or isn't yours.
      parameters:
      - description: Credential ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: New encrypted values
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.CredentialRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update a credential
      tags:
      - credentials
  /login:
    post:
      consumes:
      - application/json
      description: Verifies the client-derived auth hash and returns a JWT. Wrong
        password and unknown email return the same 401.
      parameters:
      - description: Email and auth hash (base64, 32 bytes)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Log in
      tags:
      - auth
  /me:
    get:
      description: Returns the user ID from the JWT. Useful for checking a token.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Current user
      tags:
      - auth
  /me/password:
    put:
      consumes:
      - application/json
      description: Verifies the old auth hash, then stores a new salt, auth hash,
        and re-wrapped vault key. Credentials are untouched.
      parameters:
      - description: Old auth hash plus new salt (16), auth hash (32), wrapped vault
          key (60), all base64
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.ChangePasswordRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Change master password
      tags:
      - auth
  /recover/key:
    post:
      consumes:
      - application/json
      description: Verifies the recovery auth hash and returns the recovery-wrapped
        vault key.
      parameters:
      - description: Email and recovery auth hash (base64, 32 bytes)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.RecoverKeyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Start account recovery
      tags:
      - auth
  /recover/reset:
    post:
      consumes:
      - application/json
      description: Verifies the recovery auth hash again, then sets a new salt, auth
        hash, and password-wrapped vault key.
      parameters:
      - description: Email, recovery auth hash, new salt (16), new auth hash (32),
          new wrapped vault key (60)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.RecoverResetRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Finish account recovery
      tags:
      - auth
  /register:
    post:
      consumes:
      - application/json
      description: Creates a user from a client-generated salt and client-derived
        auth hash (both base64). The server never receives the master password.
      parameters:
      - description: Email, salt (16 bytes), auth hash (32 bytes)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new account
      tags:
      - auth
  /salt:
    get:
      description: Returns the account's salt so the client can derive its keys. Unknown
        emails get a deterministic fake salt, so this can't be used to check which
        emails are registered.
      parameters:
      - description: Account email
        in: query
        name: email
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get the salt for an email
      tags:
      - auth
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
