name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build CLI
        env:
          CGO_ENABLED: "0"
          # Set this repo variable to your deployed API, e.g. https://api.example.com
          SERVER_URL: ${{ vars.GOPASS_SERVER_URL }}
        run: |
          for target in linux/amd64 linux/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}
            ext=""; [ "$os" = windows ] && ext=".exe"
            GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.defaultServer=${SERVER_URL:-http://localhost:8080}" \
              -o "dist/gopass-$os-$arch$ext" ./cmd/gopass
          done
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
